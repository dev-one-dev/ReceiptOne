<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReceiptOne — social card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Same request as __root.tsx: weight ceiling is 600. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <style>
      /* Tokens mirrored from src/receiptone-tokens.css */
      :root {
        --paper: #f5f4f0;
        --ink: #0d0d14;
        --ember: #f97316;
        --font-display: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "Geist Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-display);
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
      }
      .left {
        position: absolute;
        left: 56px;
        top: 56px;
        bottom: 56px;
        width: 604px; /* 55% of the canvas minus the gutter */
        display: flex;
        flex-direction: column;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo svg.mark {
        width: 48px;
        height: 48px;
      }
      .logo svg.word {
        height: 29px;
        width: auto;
      }
      .headline {
        margin-top: 60px;
        font-size: var(--headline-size, 64px);
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.04em; /* tracking-display */
        text-wrap: balance;
      }
      .headline .dot {
        color: var(--ember);
      }
      .sub {
        margin-top: 22px;
        max-width: 560px;
        font-size: 26px;
        font-weight: 400;
        line-height: 1.3;
        letter-spacing: 0;
        color: rgba(13, 13, 20, 0.7);
      }
      .domain {
        margin-top: auto;
        font-family: var(--font-mono);
        font-size: 14px;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.025em; /* tracking-mono */
        color: rgba(13, 13, 20, 0.6);
      }
      .domain::before {
        content: "";
        display: block;
        width: 40px;
        height: 2px;
        margin-bottom: 14px;
        background: var(--ember); /* the one ember accent: a thin rule */
      }
      .shot {
        position: absolute;
        left: 700px;
        top: 72px;
        width: 620px; /* bleeds 120px off the right edge */
        border-radius: 12px;
        border: 1px solid rgba(13, 13, 20, 0.1);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
        background: #fff;
        overflow: hidden;
      }
      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="left">
        <div class="logo">{{LOGO_MARK_SVG}} {{LOGO_WORDMARK_SVG}}</div>
        <h1 class="headline">
          Turn receipts into CRA-ready reports — automatically<span class="dot">.</span>
        </h1>
        <p class="sub">
          Snap receipts &amp; mileage, organize expenses, and export audit-ready reports.
        </p>
        <p class="domain">receipt-one.com</p>
      </div>
      <div class="shot"><img src="{{SCREENSHOT_SRC}}" alt="" /></div>
    </div>
  </body>
</html>
